services:
  - type: web
    name: slowyshop
    env: node
    plan: 1c-2g
    domains:
      - slowy.lol
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: slowyshop-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: PAYMENT_MODE
        value: yookassa
      - key: DB_PATH
        value: /var/data/db.json
      - key: COOKIE_SECURE
        value: "true"
      - key: SEED_DEMO_INVENTORY
        value: "false"
      - key: EMAIL_REQUIRED
        value: "true"
      - key: APP_ORIGIN
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_SECURE
        value: "true"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: YOOKASSA_SHOP_ID
        sync: false
      - key: YOOKASSA_SECRET_KEY
        sync: false
